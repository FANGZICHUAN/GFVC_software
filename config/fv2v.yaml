codec_name: 'FV2V'             ## 'FV2V' OR 'FOMM' OR 'CFTE' ###You should choose which GFVC model to be used.

#dataset params 
sequence_dir: '/home/ysz/datasets/testing_sequence_30/'
yuv_sequence_dir: '/home/ysz/datasets/testing_sequence_30_yuv420/'''
seq_list: ['002'] #,'002','003','004','005','006','007','008','009','010','011','012','013','014','015']
dataset: 'ClassA' ## 'CFVQA' OR 'VOXCELEB' CFVQA_NEW ###You should choose which dataset to be encoded.
num_frames: 250 # 125  frames for 'CFVQA'


#video params   
height: 256
width: 256
iframe_format: 'YUV420'   ## 'YUV420'  OR 'RGB444' ###You need to define what color format to use for encoding the first frame.

#codec params   
inference_mode: 'decoder'           ## "encoder" OR 'decoder'   ###You need to define whether to encode or decode a sequence.
qp_list: ['22'] #, "32", "42", "52"]
feature_coding_mode: 'SEI' # AE or SEI
ae_qf: [256, 256] #Number of bins for KP coding
sei_coordinate_qf: 12
sei_matrix_qf: 8
encoder_type: 'FV2V'
no_analysis_in_decoder: 'OFF'
color_calibration: 'OFF'


# Stay 'OFF' for FV2V
base_layer_params: #Parameters for base layer coder
  use_base_layer: 'OFF' #Set to 'OFF' to fall back to animation-only reconstruction
  qp: [0]


#evaluation params
metrics: ['dists', 'lpips', 'psnr', 'ssim']
