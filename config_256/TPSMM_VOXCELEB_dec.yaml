codec_name: 'TPSMM'

#dataset params 
dataset: 'VOXCELEB'
num_frames: 100

#video params   
height: 256
width: 256
iframe_format: 'YUV420'

#codec params   
inference_mode: 'decoder'
qp_list: ["42"]
feature_coding_mode: 'SEI'
ae_qf: [128,128]
sei_coordinate_qf: 8
sei_matrix_qf: 4
encoder_type: 'TPSMM'
no_analysis_in_decoder: 'OFF' 
color_calibration: 'OFF'

# Stay 'OFF' for TPSMM
base_layer_params:
  use_base_layer: 'OFF'
  qp: [0] 

#evaluation params
metrics: ['dists','lpips','psnr', 'ssim']