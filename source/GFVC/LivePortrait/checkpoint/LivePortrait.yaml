# LivePortrait Model Configuration
# Based on face-vid2vid with enhanced 3D keypoint modeling

model_params:
  common_params:
    num_kp: 21
    num_channels: 3
    estimate_jacobian: True
    
  appearance_params:
    image_channel: 3
    block_expansion: 64
    num_down_blocks: 2
    max_features: 512
    reshape_channel: 32
    reshape_depth: 16
    num_resblocks: 6
    
  kp_detector_params:
    image_channel: 3
    block_expansion: 32
    num_kp: 21
    num_channels: 3
    max_features: 1024
    
  warping_params:
    num_kp: 21
    block_expansion: 64
    num_down_blocks: 2
    max_features: 512
    reshape_channel: 32
    estimate_occlusion_map: True
    dense_motion_params:
      block_expansion: 32
      num_blocks: 5
      max_features: 1024
      reshape_depth: 16
      compress: 4
    
  generator_params:
    num_kp: 21
    block_expansion: 64
    num_blocks: 5
    max_features: 512
    upscale: 2
    out_channels: 64
    num_down_blocks: 2

dataset_params:
  root_dir: ./dataset/vox-png
  frame_shape: [256, 256, 3]
  id_sampling: True
  pairs_list: null
  augmentation_params:
    flip_param:
      horizontal_flip: True
      time_flip: True
    resize_param:
      ratio: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
    jitter_param:
      hue: 0.15
      saturation: 0.15
      contrast: 0.15
      brightness: 0.15

train_params:
  num_epochs: 100
  num_repeats: 75
  epoch_milestones: [60, 90]
  lr_generator: 2.0e-4
  lr_discriminator: 2.0e-4
  batch_size: 4
  scales: [1, 0.5, 0.25, 0.125]
  checkpoint_freq: 5
  transform_params:
    sigma_affine: 0.05
    sigma_tps: 0.005
    points_tps: 5
  loss_weights:
    perceptual: [10, 10, 10, 10, 10]
    generator_gan: 1
    discriminator_gan: 1
    feature_matching: [10, 10, 10, 10, 10]
    keypoint: 10
    jacobian: 10
    equivariance_value: 10
    equivariance_jacobian: 10
